name: Release tools

# When a release is published, build the host-side tools as universal binaries,
# attach the zip to the release, and update the Homebrew formula in the tap if
# HOMEBREW_TAP_TOKEN (a token with push access to VadimToptunov/homebrew-tap) is set.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. 1.10.0"
        required: true

permissions:
  contents: write

jobs:
  tools:
    name: Build and attach the tools
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Build
        run: Scripts/build-tools.sh "$TAG"

      - name: Render the Homebrew formula
        run: |
          sha="$(cat "dist/kassios-$TAG-macos.zip.sha256")"
          sed -e "s/@VERSION@/$TAG/g" -e "s/@SHA256@/$sha/" Scripts/homebrew/kassios.rb > dist/kassios.rb

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            "dist/kassios-$TAG-macos.zip" "dist/kassios-$TAG-macos.zip.sha256" dist/kassios.rb

      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/VadimToptunov/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/kassios.rb tap/Formula/kassios.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kassios.rb
          git diff --cached --quiet || git commit -m "kassios $TAG"
          git push
